services:
  # FastAPI
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    volumes:
      - ./api:/app:z
    container_name: monserver_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://monuser:monpass@db:5432/mondb
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monnet

  # PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: monserver_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: monuser
      POSTGRES_PASSWORD: monpass
      POSTGRES_DB: mondb
    volumes:
      - ./db/data:/var/lib/postgresql/data:z
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monuser -d mondb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - monnet

networks:
  monnet:
    driver: bridge